# Hyprsunset configuration
# Adjust these values to your preference

# Temperature (in Kelvin)
# Lower = warmer (more orange/red), Higher = cooler (more blue)
# Daytime: 6500K, Night: 3000-4000K
temperature = 4000

# Schedule - auto adjust based on time of day
# [start_time, end_time] in 24h format
schedule = [
    [6, 6500],    # 6AM - cool (daytime)
    [18, 4000],   # 6PM - warm (evening)
    [20, 3000]    # 8PM - warmer (night)
]
